[base]
package = minigrid
env_name = minigrid
policy_name = MLP
rnn_name = None

[policy]
hidden_size = 512

[env]
grid_size = 64

[vec]
num_envs = 512
num_workers = 4

[train]
total_timesteps = 2_000_000
batch_size = auto
minibatch_size = 8192
update_epochs = 4
anneal_lr = False
gae_lambda = 0.95
gamma = 0.95
ent_coef = 0.025
learning_rate = 2.5e-4
