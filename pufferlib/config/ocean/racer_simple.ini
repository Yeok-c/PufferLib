[base]
package = ocean
env_name = puffer_racer_simple
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 8

[env]
num_envs = 1024
frameskip = 4
width = 1080
height = 720
track_width = 75
max_whisker_length = 300
num_whiskers = 12
w_ang = 0.784 # PI / 4
turn_rate = 0.0785
maxv = 5
min_v = 1.0
accel = 0.2
decel = 0.3
reward_scale = 1.0
car_radius = 12
num_npcs = 2
npc_radius = 12
max_lives = 3
collision_penalty = 1.0
num_points = 16
bezier_resolution = 4
rng = 6

[policy]
hidden_size = 64

[rnn]
input_size = 64
hidden_size = 64

[train]
batch_size = auto
bptt_horizon = 64
clip_coef = 0.2
ent_coef = 0.01
gae_lambda = 0.95
gamma = 0.99
learning_rate = 0.005
max_grad_norm = 1.0
minibatch_size = 16384
total_timesteps = 200_000_000
vf_coef = 1.0
