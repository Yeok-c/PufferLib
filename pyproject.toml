[project]
name = "pufferlib"
version = "3.0.0"
description = "Fast and sane reinforcement learning"
requires-python = ">=3.10"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
authors = [{ name = "Joseph Suarez", email = "jsuarez@puffer.ai" }]
classifiers=[
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["dependencies"]

# Default Gym/Gymnasium/PettingZoo versions
# Gym:
# - 0.26 still has deprecation warnings and is the last version of the package
# - 0.25 adds a breaking API change to reset, step, and render_modes
# - 0.24 is broken
# - 0.22-0.23 triggers deprecation warnings by calling its own functions
# - 0.21 is the most stable version
# - <= 0.20 is missing dict methods for gym.spaces.Dict
# - 0.18-0.21 require setuptools<=65.5.0
#'gym==0.23',
#'gymnasium==0.29.1',
#'pettingzoo==1.24.1',
[project.optional-dependencies]
atari = [
    'gymnasium>=1.2.2',
    'opencv-python>=3.4.17.63',
    'ale_py>=0.9.0',
]

box2d = [
    'gymnasium[box2d]>=1.2.2',
    'swig==4.1.1',
]

butterfly = [
    'gymnasium>=1.2.2',
    'pettingzoo[butterfly]==1.24.1',
]

classic_control = [
    'gymnasium>=1.2.2',
]

craftax = [
    'gymnasium>=1.2.2',
    'craftax',
]

kinetix = [
    'gymnasium>=1.2.2',
    'kinetix-env',
]

magent = [
    'gymnasium>=1.2.2',
    'pettingzoo>=1.24.1',
    'magent==0.2.4',
    # The Magent2 package is broken for now
    #'magent2==0.3.2',
]

minigrid = [
    'gymnasium>=1.2.2',
    'minigrid==2.3.1',
]

mujoco = [
    'gymnasium[mujoco]>=1.2.2',
    'moviepy',
]

open_spiel = [
    'gymnasium>=1.2.2',
    'pettingzoo>=1.24.1',
    'open_spiel==1.3',
]

pokemon_red = [
    'gymnasium>=1.2.2',
    'pokegym>=0.2.0',
    'einops==0.6.1',
    'matplotlib',
    'scikit-image',
    'pyboy<2.0.0',
    'hnswlib==0.7.0',
    'mediapy',
    'pandas==2.0.2',
    'pettingzoo',
    'websockets',
]

#'smac': [
#    'git+https://github.com/oxwhirl/smac.git',
#],
#'stable-retro': [
#    'git+https://github.com/Farama-Foundation/stable-retro.git',
#]

vizdoom = [
    'gymnasium>=1.2.2',
    'vizdoom==1.2.3',
    'stable_baselines3==2.7.1',
]

ray = [
    'ray==2.23.0',
]

cleanrl = [
    'stable_baselines3==2.7.1',
    'tensorboard==2.11.2',
    'tyro==0.8.6',
]

[project.scripts]
puffer = "pufferlib.pufferl:main"

[project.urls]
Homepage = "https://puffer.ai"

[build-system]
requires = ["setuptools", "wheel", "Cython", "numpy>=2.0.0,<3.0.0", "torch"]
build-backend = "setuptools.build_meta"

[tool.uv]
no-build-isolation-package = ["torch"]
conflicts = [
    # Many environment extras have incompatible transitive dependency pins
    # (e.g., different pygame / nle versions). Declare them as mutually exclusive
    # so `uv lock` / `uv sync` can still succeed.
    [
        { extra = "magent" },
        { extra = "butterfly" },
        { extra = "box2d" },
        { extra = "minigrid" },
        { extra = "vizdoom" },
    ],
]

[tool.setuptools]
license-files = ["LICENSE"]
